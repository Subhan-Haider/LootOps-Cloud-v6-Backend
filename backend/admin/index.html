<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage Server | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    [v-cloak] { display: none; }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            indigo: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' },
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
  <div id="app" class="flex-1 w-full max-w-5xl mx-auto p-4 md:p-8 flex flex-col">
    <!-- View will be rendered here -->
  </div>

  <script>
    // State
    let token = localStorage.getItem('admin_token') || null;
    let currentTab = 'settings'; // 'settings' or 'users'
    let settings = null;
    let users = [];
    let loading = false;
    let loadingUsers = false;
    let errorMsg = "";
    let successMsg = "";

    // DOM Elements
    const app = document.getElementById('app');

    // API calls
    async function apiRequest(endpoint, options = {}) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      
      const res = await fetch(endpoint, { ...options, headers });
      const data = await res.json();
      
      if (!res.ok) {
        if (res.status === 401) {
          token = null;
          localStorage.removeItem('admin_token');
          render();
        }
        throw new Error(data.error || 'API Error');
      }
      return data;
    }

    async function login(e) {
      e.preventDefault();
      const apiKey = document.getElementById('api_key').value;
      loading = true; errorMsg = ""; render();
      try {
        const data = await apiRequest('/api/admin/auth', { method: 'POST', body: JSON.stringify({ apiKey }) });
        token = data.token;
        localStorage.setItem('admin_token', token);
        await loadData();
      } catch (err) {
        errorMsg = err.message;
      }
      loading = false;
      render();
    }

    async function loadData() {
      if (currentTab === 'settings') {
        try {
          const data = await apiRequest('/api/admin/settings');
          settings = data.settings;
          if (!settings.allowedOrigins) settings.allowedOrigins = [];
          if (!settings.allowedEmails) settings.allowedEmails = [];
        } catch (err) {
          errorMsg = err.message;
        }
      } else if (currentTab === 'users') {
        loadingUsers = true;
        render();
        try {
          const data = await apiRequest('/api/admin/users');
          users = data.users || [];
        } catch (err) {
          errorMsg = err.message;
        }
        loadingUsers = false;
        render();
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      errorMsg = "";
      successMsg = "";
      render();
      if ((tab === 'settings' && !settings) || (tab === 'users' && users.length === 0)) {
        loadData().then(render);
      }
    }

    async function saveSettings(e) {
      e.preventDefault();
      loading = true; errorMsg = ""; successMsg = ""; render();
      
      const originsRaw = document.getElementById('allowedOrigins').value;
      const emailsRaw = document.getElementById('allowedEmails').value;
      
      const allowedOrigins = originsRaw.split('\n').map(s => s.trim()).filter(Boolean);
      const allowedEmails = emailsRaw.split('\n').map(s => s.trim()).filter(Boolean);
      const rootMessage = document.getElementById('rootMessage').value;
      
      const updatedSettings = {
        ...settings,
        allowedOrigins,
        allowedEmails,
        rootMessage,
      };

      try {
        await apiRequest('/api/admin/settings', { method: 'POST', body: JSON.stringify({ settings: updatedSettings }) });
        settings = updatedSettings;
        successMsg = "Settings saved successfully!";
        setTimeout(() => { successMsg = ""; render(); }, 3000);
      } catch (err) {
        errorMsg = err.message;
      }
      loading = false;
      render();
    }

    async function toggleUserStatus(uid, currentStatus) {
      if (!confirm(`Are you sure you want to ${currentStatus ? 'enable' : 'disable'} this user?`)) return;
      try {
        await apiRequest(`/api/admin/users/${uid}/status`, { 
          method: 'POST', 
          body: JSON.stringify({ disabled: !currentStatus }) 
        });
        const user = users.find(u => u.uid === uid);
        if (user) user.disabled = !currentStatus;
        render();
      } catch (err) {
        alert("Failed: " + err.message);
      }
    }

    async function deleteUser(uid, email) {
      if (!confirm(`WARNING! Are you sure you want to PERMANENTLY delete the account for ${email}? This action cannot be undone.`)) return;
      try {
        await apiRequest(`/api/admin/users/${uid}`, { method: 'DELETE' });
        users = users.filter(u => u.uid !== uid);
        render();
      } catch (err) {
        alert("Failed to delete user: " + err.message);
      }
    }

    function logout() {
      token = null;
      settings = null;
      users = [];
      localStorage.removeItem('admin_token');
      render();
    }

    function formatDate(dateStr) {
      if (!dateStr) return 'Never';
      return new Date(dateStr).toLocaleString();
    }

    // Render functions
    function renderLogin() {
      return `
        <div class="flex-1 flex items-center justify-center">
          <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800 p-8">
            <div class="flex justify-center mb-6">
              <div class="h-12 w-12 bg-indigo-500/10 text-indigo-500 rounded-xl flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
            </div>
            <h1 class="text-2xl font-bold text-center mb-2">Admin Login</h1>
            <p class="text-slate-500 text-center mb-8 text-sm">Enter your master API KEY to access backend settings.</p>
            
            ${errorMsg ? `<div class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100 dark:bg-red-900/20 dark:border-red-900/30">${errorMsg}</div>` : ''}
            
            <form onsubmit="login(event)" class="space-y-4">
              <div>
                <label class="block text-sm font-medium mb-1">API Key</label>
                <input type="password" id="api_key" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="••••••••••••">
              </div>
              <button type="submit" ${loading ? 'disabled' : ''} class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg px-4 py-2.5 transition-colors disabled:opacity-50">
                ${loading ? 'Authenticating...' : 'Sign In'}
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function renderHeader() {
      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
          <div>
            <h1 class="text-3xl font-bold flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-500"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
              Backend Admin
            </h1>
            <p class="text-slate-500 text-sm mt-1">Manage server configuration and users</p>
          </div>
          <button onclick="logout()" class="px-4 py-2 border border-slate-200 dark:border-slate-800 rounded-lg text-sm hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">Sign Out</button>
        </div>
        
        <div class="flex border-b border-slate-200 dark:border-slate-800 mb-6 gap-6">
          <button onclick="switchTab('settings')" class="pb-3 text-sm font-medium border-b-2 transition-colors ${currentTab === 'settings' ? 'border-indigo-500 text-indigo-600 dark:text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}">Settings</button>
          <button onclick="switchTab('users')" class="pb-3 text-sm font-medium border-b-2 transition-colors ${currentTab === 'users' ? 'border-indigo-500 text-indigo-600 dark:text-indigo-400' : 'border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}">Users</button>
        </div>
        
        ${errorMsg ? `<div class="bg-red-50 text-red-600 p-4 rounded-xl mb-6 border border-red-100">${errorMsg}</div>` : ''}
        ${successMsg ? `<div class="bg-emerald-50 text-emerald-600 p-4 rounded-xl mb-6 border border-emerald-100">${successMsg}</div>` : ''}
      `;
    }

    function renderSettings() {
      if (!settings) return `<div class="text-center py-20 text-slate-500">Loading settings...</div>`;
      return `
        <form onsubmit="saveSettings(event)" class="space-y-6">
          <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm">
            <h2 class="text-lg font-semibold mb-1">General Settings</h2>
            <p class="text-sm text-slate-500 mb-4">Basic server configuration.</p>
            <div>
              <label class="block text-sm font-medium mb-2">Root Message</label>
              <input type="text" id="rootMessage" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" value="${settings.rootMessage || 'Storage Server Admin API Running 🔒'}" />
              <p class="text-xs text-slate-500 mt-2">The message shown when visiting the base URL of this API.</p>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm">
            <h2 class="text-lg font-semibold mb-1">CORS & Security</h2>
            <p class="text-sm text-slate-500 mb-4">Manage which domains are allowed to communicate with this backend API.</p>
            <div>
              <label class="block text-sm font-medium mb-2">Authorized Frontend URLs (One per line)</label>
              <textarea id="allowedOrigins" rows="4" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 font-mono text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="https://lootops-cloud.subhan.tech\nhttp://localhost:3000">${settings.allowedOrigins.join('\n')}</textarea>
              <p class="text-xs text-slate-500 mt-2">Example: <code>https://lootops-cloud.subhan.tech</code> (no trailing slash).</p>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-2xl p-6 border border-slate-200 dark:border-slate-800 shadow-sm">
            <h2 class="text-lg font-semibold mb-1">Access Control</h2>
            <p class="text-sm text-slate-500 mb-4">Emails authorized to access the system.</p>
            <div>
              <label class="block text-sm font-medium mb-2">Allowed Emails (One per line)</label>
              <textarea id="allowedEmails" rows="4" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-4 py-3 font-mono text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">${settings.allowedEmails.join('\n')}</textarea>
              <p class="text-xs text-slate-500 mt-2">Users logging in with these emails via Firebase will be granted access.</p>
            </div>
          </div>

          <div class="flex justify-end">
            <button type="submit" ${loading ? 'disabled' : ''} class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl px-6 py-2.5 transition-colors shadow-sm disabled:opacity-50 flex items-center gap-2">
              ${loading ? 'Saving...' : 'Save Changes'}
            </button>
          </div>
        </form>
      `;
    }

    function renderUsers() {
      if (loadingUsers) return `<div class="text-center py-20 text-slate-500">Loading users...</div>`;
      
      let rows = users.map(user => `
        <tr class="border-b border-slate-100 dark:border-slate-800/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
          <td class="py-3 px-4">
            <div class="font-medium text-sm">${user.email || 'No Email'}</div>
            <div class="text-xs text-slate-500 font-mono mt-0.5">${user.uid}</div>
          </td>
          <td class="py-3 px-4">
            ${user.disabled 
              ? '<span class="px-2 py-1 bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400 rounded-md text-xs font-medium border border-red-200 dark:border-red-800">Disabled</span>'
              : '<span class="px-2 py-1 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 rounded-md text-xs font-medium border border-emerald-200 dark:border-emerald-800">Active</span>'
            }
          </td>
          <td class="py-3 px-4 text-sm text-slate-500">
            ${formatDate(user.lastSignInTime)}
          </td>
          <td class="py-3 px-4 text-sm text-slate-500">
            ${formatDate(user.creationTime)}
          </td>
          <td class="py-3 px-4 text-right space-x-2">
            <button onclick="toggleUserStatus('${user.uid}', ${user.disabled})" class="text-xs font-medium px-3 py-1.5 rounded-lg border ${user.disabled ? 'text-emerald-600 border-emerald-200 hover:bg-emerald-50 dark:hover:bg-emerald-900/20' : 'text-orange-600 border-orange-200 hover:bg-orange-50 dark:hover:bg-orange-900/20'} transition-colors">
              ${user.disabled ? 'Enable' : 'Disable'}
            </button>
            <button onclick="deleteUser('${user.uid}', '${user.email || user.uid}')" class="text-xs font-medium px-3 py-1.5 rounded-lg border text-red-600 border-red-200 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
              Delete
            </button>
          </td>
        </tr>
      `).join('');

      if (users.length === 0) {
        rows = `<tr><td colspan="5" class="py-12 text-center text-slate-500">No users found.</td></tr>`;
      }

      return `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 dark:bg-slate-950/50 border-b border-slate-200 dark:border-slate-800">
                  <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">User</th>
                  <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
                  <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Last Sign In</th>
                  <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Created</th>
                  <th class="py-3 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${rows}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderDashboard() {
      return `
        ${renderHeader()}
        ${currentTab === 'settings' ? renderSettings() : renderUsers()}
      `;
    }

    function render() {
      if (!token) {
        app.innerHTML = renderLogin();
      } else {
        if (!settings && currentTab === 'settings' && !errorMsg) {
          loadData().then(render);
          app.innerHTML = renderHeader() + `<div class="text-center py-20 text-slate-500">Loading settings...</div>`;
        } else {
          app.innerHTML = renderDashboard();
        }
      }
    }

    // Init
    render();
  </script>
</body>
</html>
